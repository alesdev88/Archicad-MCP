# Swept Beam parameters, in parameter-list order. See the spec, section 1.1.
# Types: length angle real integer boolean string surface pen linetype bmat profile fill.
# A list default makes an array parameter. All node arrays share one length.

[[param]]
name = "A"
type = "length"
# 1 m, so that Tapir's SetGDLParametersOfElements, which writes A in metres
# into the placed size ratio (the size over this default), cannot scale the
# beam; the default beam is still 3 m long through nodeX (gate E)
default = 1.0
description = "Length (two-node straight beams)"

[[param]]
name = "B"
type = "length"
# 1 m for the same reason as A
default = 1.0
description = "B (unused)"
hidden = true

[[param]]
name = "ZZYZX"
type = "length"
default = 0.2
description = "Height (unused)"
hidden = true

[[param]]
name = "AC_show2DHotspotsIn3D"
type = "boolean"
default = false
description = "Show 2D hotspots in 3D"
hidden = true

[[param]]
name = "aDone"
type = "length"
default = 1.0
description = "Length already applied (helper)"
hidden = true

[[param]]
name = "nodeX"
type = "length"
default = [0.0, 3.0]
description = "Node X"

[[param]]
name = "nodeY"
type = "length"
default = [0.0, 0.0]
description = "Node Y"

[[param]]
name = "nodeZ"
type = "length"
default = [0.0, 0.0]
description = "Node height"

[[param]]
name = "nodeRoll"
type = "angle"
default = [0.0, 0.0]
description = "Node roll"

[[param]]
name = "segArc"
type = "angle"
default = [0.0, 0.0]
description = "Arc angle to the next node"

[[param]]
name = "slopePercent"
type = "real"
default = 0.0
description = "Slope (%)"

[[param]]
name = "slopeDone"
type = "real"
# the slope already applied; -9999 marks a beam from before the pair, which
# takes its shown slope as applied (see the Parameter Script)
default = -9999.0
description = "Slope applied (helper)"
hidden = true

[[param]]
name = "pathTolerance"
type = "length"
default = 0.002
description = "Curve tolerance"

[[param]]
name = "gripNodes"
type = "boolean"
default = true
description = "Node grips"

[[param]]
name = "gripCurves"
type = "boolean"
default = true
description = "Curve grips"

[[param]]
name = "gripAdd"
type = "boolean"
default = true
description = "Add-node grips"

[[param]]
name = "gripCuts"
type = "boolean"
default = true
description = "End cut grips"

[[param]]
name = "refLine"
type = "string"
default = "Centre"
description = "Reference line at"

[[param]]
name = "refOffset"
type = "length"
default = 0.0
description = "Offset from the reference line"

[[param]]
name = "segSag"
type = "length"
default = [0.0, 0.0]
description = "Curve grip (helper)"
hidden = true

[[param]]
name = "sagDone"
type = "length"
default = [0.0, 0.0]
description = "Curve grip applied (helper)"
hidden = true
[[param]]
name = "insL"
type = "length"
default = [0.0, 0.0]
description = "Insert grip (helper)"
hidden = true
[[param]]
name = "extStart"
type = "length"
default = 0.0
description = "Add-node grip at the start (helper)"
hidden = true
[[param]]
name = "extEnd"
type = "length"
default = 0.0
description = "Add-node grip at the end (helper)"
hidden = true
[[param]]
name = "insDone"
type = "length"
default = [0.0, 0.0]
description = "Insert grip applied (helper)"
hidden = true
[[param]]
name = "extStartDone"
type = "length"
default = 0.0
description = "Start grip applied (helper)"
hidden = true
[[param]]
name = "extEndDone"
type = "length"
default = 0.0
description = "End grip applied (helper)"
hidden = true
[[param]]
name = "cutStartPlan"
type = "angle"
default = 0.0
description = "Start cut in plan"

[[param]]
name = "cutStartTilt"
type = "angle"
default = 0.0
description = "Start cut tilt"

[[param]]
name = "cutEndPlan"
type = "angle"
default = 0.0
description = "End cut in plan"

[[param]]
name = "cutEndTilt"
type = "angle"
default = 0.0
description = "End cut tilt"

[[param]]
name = "profileMode"
type = "string"
default = "Rectangle"
description = "Section source"

[[param]]
name = "beamProfile"
type = "profile"
default = 1
description = "Profile"

[[param]]
name = "rectW"
type = "length"
default = 0.2
description = "Rectangle width"

[[param]]
name = "rectH"
type = "length"
default = 0.2
description = "Rectangle height"

[[param]]
name = "rectBMat"
type = "bmat"
default = 1
description = "Rectangle building material"

[[param]]
name = "profileOffsetU"
type = "length"
default = 0.0
description = "Section origin shift sideways"

[[param]]
name = "profileOffsetW"
type = "length"
default = 0.0
description = "Section origin shift up"

[[param]]
name = "flipProfile"
type = "boolean"
default = false
description = "Flip section"

[[param]]
name = "overrideSurface"
type = "boolean"
default = false
description = "Override surfaces"

[[param]]
name = "surfaceOverride"
type = "surface"
default = 1
description = "Override surface"
child = true

[[param]]
name = "outlinePen"
type = "pen"
default = 1
description = "Outline pen"

[[param]]
name = "showPlanFill"
type = "boolean"
# off: the footprint uses the part's own empty fill, which only makes the plan
# symbol clickable everywhere (as in the office closet object)
default = false
description = "Show plan fill"

[[param]]
name = "planFill"
type = "fill"
# a project fill attribute; 0 is none and shows as MISSING in the picker
default = 1
description = "Plan fill"
child = true

[[param]]
name = "fillFgPen"
type = "pen"
default = 1
description = "Plan fill pen"
child = true

[[param]]
name = "fillBgPen"
type = "pen"
# 0 is a transparent background
default = 0
description = "Plan fill background pen"
child = true

[[param]]
name = "showAxis"
type = "boolean"
default = false
description = "Show reference axis"

[[param]]
name = "axisPen"
type = "pen"
default = 1
description = "Axis pen"
child = true

[[param]]
name = "axisLineType"
type = "linetype"
# 6 is "Dot & Dashed" in the office template, MCP-Test and CVP (2026-09-29)
default = 6
description = "Axis line type"
child = true

[[param]]
name = "showNodeHeights"
type = "boolean"
default = false
description = "Show node heights"

[[param]]
name = "textPen"
type = "pen"
default = 1
description = "Text pen"
child = true

[[param]]
name = "textSizeMm"
type = "real"
default = 2.0
description = "Text size (mm)"
child = true

[[param]]
name = "gs_ui_current_page"
type = "integer"
default = 1
description = "Dialog page"
hidden = true

[[param]]
name = "sb_version"
type = "string"
default = ""
description = "Swept Beam build"
hidden = true
